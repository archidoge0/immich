name: GHAV Immich 19410 complete SQL schema before

on:
  push:
    branches:
      - codex/ghav-immich19410-sql-schema-before

permissions:
  contents: read

jobs:
  sql-schema-up-to-date:
    name: SQL Schema Checks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    services:
      postgres:
        image: ghcr.io/immich-app/postgres@sha256:d0f0ed7d0ab78f5331c87e9306b79a479c4f1bb7d8719b08f76df8c3ee460b11
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_USER: postgres
          POSTGRES_DB: immich
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432
    defaults:
      run:
        working-directory: ./server

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: 6c7b2e4b5c59264b2a8c23048126a1ef793ac6bc

      - name: Verify pinned source and input lock
        working-directory: .
        run: |
          test "$(git rev-parse HEAD)" = '6c7b2e4b5c59264b2a8c23048126a1ef793ac6bc'
          test "$(git rev-parse HEAD^{tree})" = 'df766e5802d69b336f30f101ab05b1d83597d68a'
          echo "GHAV_SOURCE_SHA=$(git rev-parse HEAD)"
          echo "GHAV_SOURCE_TREE=$(git rev-parse HEAD^{tree})"
          echo "GHAV_INPUT_LOCK=$(sha256sum server/package-lock.json | cut -d' ' -f1)"
      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.16.0'

      - name: Install server dependencies
        run: npm ci

      - name: Build the app
        run: npm run build

      - name: Run existing migrations
        run: npm run migrations:run

      - name: Test npm run schema:reset command works
        run: npm run schema:reset

      - name: Generate new migrations
        continue-on-error: true
        run: npm run migrations:generate src/TestMigration

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-files
        with:
          files: |
            server/src
      - name: Verify migration files have not changed
        if: steps.verify-changed-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated migration files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          cat ./src/*-TestMigration.ts
          exit 1

      - name: Run SQL generation
        run: npm run sync:sql
        env:
          DB_URL: postgres://postgres:postgres@localhost:5432/immich

      - name: Find file changes
        uses: tj-actions/verify-changed-files@a1c6acee9df209257a246f2cc6ae8cb6581c1edf # v20.0.4
        id: verify-changed-sql-files
        with:
          files: |
            server/src/queries

      - name: Verify SQL files have not changed
        if: steps.verify-changed-sql-files.outputs.files_changed == 'true'
        env:
          CHANGED_FILES: ${{ steps.verify-changed-sql-files.outputs.changed_files }}
        run: |
          echo "ERROR: Generated SQL files not up to date!"
          echo "Changed files: ${CHANGED_FILES}"
          git diff
          exit 1

      - name: Record complete SQL-schema witnesses
        if: ${{ !cancelled() }}
        working-directory: .
        run: |
          test -s server/dist/main.js
          git diff --quiet HEAD -- server/src
          echo "GHAV_NODE_VERSION=$(node --version)"
          echo "GHAV_NPM_VERSION=$(npm --version)"
          echo "GHAV_FINAL_LOCK=$(sha256sum server/package-lock.json | cut -d' ' -f1)"
          echo "GHAV_SERVER_MAIN=$(sha256sum server/dist/main.js | cut -d' ' -f1)"
          echo "GHAV_SQL_FILE_COUNT=$(git ls-files server/src/queries | wc -l | tr -d ' ')"
