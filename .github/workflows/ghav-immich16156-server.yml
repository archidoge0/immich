name: GHAV Immich 16156 server image
on:
  push:
    branches:
      - codex/ghav-immich16156-before
      - codex/ghav-immich16156-human
      - codex/ghav-immich16156-ours
permissions:
  contents: read
  packages: write
jobs:
  server-image:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout fixed historical source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 924d11a913642a60553b979c5311f3d249ff528a
          persist-credentials: false
      - name: Verify fixed complete server build inputs
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "924d11a913642a60553b979c5311f3d249ff528a"
          echo "GHAV_SOURCE_SHA=$(git rev-parse HEAD)"
          sha256sum server/Dockerfile server/package-lock.json web/package-lock.json open-api/typescript-sdk/package-lock.json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Log in to fork-owned GHCR namespace
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build complete linux-amd64 server image
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        env:
          SOURCE_DATE_EPOCH: "1739799705"
        with:
          context: .
          file: server/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: false
          sbom: false
          outputs: type=oci,dest=/tmp/ghav-immich16156-server.oci.tar,rewrite-timestamp=true
          build-args: |
            DEVICE=cpu
            BUILD_ID=ghav-fixed-16156
            BUILD_IMAGE=ghav-fixed-16156
            BUILD_SOURCE_REF=ghav-fixed-16156
            BUILD_SOURCE_COMMIT=924d11a913642a60553b979c5311f3d249ff528a
          cache-from: type=registry,ref=ghcr.io/archidoge0/ghav-immich16156-server-cache:amd64-human-v1-20261001
          cache-to: type=registry,ref=ghcr.io/archidoge0/ghav-immich16156-server-cache:amd64-human-v1-20261001,mode=max,compression=zstd
      - name: Check and fingerprint complete image output
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/ghav-immich16156-server.oci.tar
          echo "GHAV_IMAGE_DIGEST=${{ steps.build.outputs.digest }}"
          echo "GHAV_OCI_ARCHIVE_SHA256=$(sha256sum /tmp/ghav-immich16156-server.oci.tar | cut -d' ' -f1)"
          echo "GHAV_OCI_ARCHIVE_BYTES=$(stat -c %s /tmp/ghav-immich16156-server.oci.tar)"
          tar -xOf /tmp/ghav-immich16156-server.oci.tar index.json
